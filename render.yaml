services:
  - type: web
    name: jal-drishti-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JAL_DB_PATH
        value: ./jal_drishiti.sqlite3
      - key: JAL_UPLOADS_PATH
        value: ./uploads
      - key: JAL_PUBLIC_BASE_URL
        value: https://jal-drishti-api-jkhn.onrender.com
      - key: JAL_JWT_SECRET
        generateValue: true
      - key: JAL_ADMIN_PASSWORD
        sync: false
      - key: JAL_OFFICE_PASSWORD
        sync: false
      - key: JAL_FIELD_PASSWORD
        sync: false
      - key: JAL_CORS_ORIGINS
        value: https://jal-drishti-sih-prototype-v2.vercel.app
      - key: JAL_CORS_ORIGIN_REGEX
        value: 'https://[a-zA-Z0-9-]+\.vercel\.app'
