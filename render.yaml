services:
  - type: web
    name: jal-drishti-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JAL_DB_PATH
        value: ./jal_drishiti.sqlite3
      - key: JAL_UPLOADS_PATH
        value: ./uploads
      - key: JAL_JWT_SECRET
        generateValue: true
      - key: JAL_ADMIN_PASSWORD
        sync: false
      - key: JAL_OFFICE_PASSWORD
        sync: false
      - key: JAL_FIELD_PASSWORD
        sync: false
      - key: JAL_CORS_ORIGINS
        sync: false
